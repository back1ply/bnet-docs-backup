name: Refresh docs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node fetch.mjs
      # Commit only when upstream content changed; the snapshot date alone is not a change.
      - run: |
          git add -A data
          if git diff --cached --quiet; then echo "No upstream changes"; exit 0; fi
          git add -A docs
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Refresh docs snapshot $(date -u +%F)"
          git push
